<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOL Carton Size Helper</title>
    <script type="module" crossorigin src="./assets/index-Dxk_XjYQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DqYbNnMS.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1 class="app-title">SOL Carton Size Helper</h1>
        <p id="contextLabel" class="context-line">正在获取当前表和视图…</p>
      </header>

      <div id="statusLine" class="status-line"></div>
      <div
        id="missingFields"
        class="status-line warning"
        style="display: none"
      ></div>

      <section class="controls">
        <div class="control-group buffer-group">
          <label class="control-label" for="innerBuffer">余量设置</label>
          <div class="control-row buffer-row">
            <div class="buffer-field">
              <span class="buffer-field-label">Inner Buffer</span>
              <input
                id="innerBuffer"
                class="number-input"
                type="number"
                value="0.6"
                min="0"
                step="0.1"
              />
            </div>
            <div class="buffer-field">
              <span class="buffer-field-label">Master Buffer</span>
              <input
                id="masterBuffer"
                class="number-input"
                type="number"
                value="1.5"
                min="0"
                step="0.1"
              />
            </div>
            <select id="bufferUnit" class="select-input buffer-unit-select">
              <option value="cm">cm</option>
              <option value="inch">inch</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label" for="innerMaterial"
            >Inner Material</label
          >
          <select id="innerMaterial" class="select-input">
            <option value="Box">Box</option>
            <option value="Poly Bag">Poly Bag</option>
          </select>
        </div>

        <div class="control-group overlap-group">
          <div class="control-header">
            <label class="control-label" for="overlapHeight">Overlap</label>
            <button id="overlapReset" type="button" class="overlap-reset">Reset</button>
          </div>
          <div class="control-row overlap-row">
            <div class="overlap-field">
              <span class="overlap-field-label">宽</span>
              <input
                id="overlapWidth"
                class="number-input"
                type="number"
                value="0"
                step="0.1"
              />
            </div>
            <div class="overlap-field">
              <span class="overlap-field-label">深</span>
              <input
                id="overlapDepth"
                class="number-input"
                type="number"
                value="0"
                step="0.1"
              />
            </div>
            <div class="overlap-field">
              <span class="overlap-field-label">高</span>
              <input
                id="overlapHeight"
                class="number-input"
                type="number"
                value="0"
                step="0.1"
              />
            </div>
            <select id="overlapUnit" class="select-input overlap-unit-select">
              <option value="cm" selected>cm</option>
              <option value="inch">inch</option>
            </select>
          </div>
        </div>

        <label class="checkbox-field">
          <input id="selectAllCheckbox" type="checkbox" />
          计算当前视图全部记录
        </label>

        <button id="calculateButton" class="primary-button">开始计算</button>
      </section>

      <section class="field-type-section">
        <h2 class="section-title">设置字段类型</h2>
        <p class="section-hint">先在多维表格中选中列，再点击需要的按钮完成类型设置。</p>
        <div class="field-type-actions">
          <button id="fieldTypeTextButton" type="button" class="secondary-button">
            文本
          </button>
          <button id="fieldTypeIntegerButton" type="button" class="secondary-button">
            整数
          </button>
          <button id="fieldTypeDecimal2Button" type="button" class="secondary-button">
            小数 0.00
          </button>
          <button id="fieldTypeCurrencyButton" type="button" class="secondary-button">
            货币
          </button>
          <button id="fieldTypeSingleSelectButton" type="button" class="secondary-button">
            单选
          </button>
          <button id="fieldTypeUserButton" type="button" class="secondary-button">
            人员
          </button>
          <button id="fieldTypeFormulaButton" type="button" class="secondary-button">
            公式
          </button>
          <button id="fieldTypeDateButton" type="button" class="secondary-button">
            日期
          </button>
          <button id="fieldTypeAttachmentButton" type="button" class="secondary-button">
            附件
          </button>
        </div>
      </section>

      <section class="view-section">
        <h2 class="section-title">一键建立视图</h2>
        <p class="section-hint">自动创建预设视图，或一键同步筛选/分组/排序到多个视图。</p>
        <div class="view-actions">
          <button id="viewThreeStageButton" type="button" class="secondary-button">
            价格
          </button>
          <button id="viewDimensionsButton" type="button" class="secondary-button">
            尺寸
          </button>
          <button id="viewTariffButton" type="button" class="secondary-button">
            关税
          </button>
          <button id="viewSpecButton" type="button" class="secondary-button">
            Spec
          </button>
          <button id="viewSyncButton" type="button" class="secondary-button">
            一键分组/排序/筛选
          </button>
        </div>
      </section>

      <section class="log-section">
        <h2 class="section-title">日志</h2>
        <p id="logPlaceholder" class="log-placeholder">
          暂无日志，点击“开始计算”查看详细结果。
        </p>
        <ul id="logList" class="log-list"></ul>
      </section>
    </div>

    <div id="confirmOverlay" class="confirm-overlay" hidden>
      <div class="confirm-dialog">
        <h3 id="confirmTitle" class="confirm-title">确认计算全部记录</h3>
        <p id="confirmMessage" class="confirm-message">
          未选择任何记录，是否继续计算当前视图的全部记录？
        </p>
        <div class="confirm-actions">
          <button id="confirmOk" class="confirm-button primary">
            确认
          </button>
          <button id="confirmSecondary" class="confirm-button secondary" hidden>
            第二操作
          </button>
          <button id="confirmCancel" class="confirm-button">
            取消
          </button>
        </div>
      </div>
    </div>

  </body>
</html>
